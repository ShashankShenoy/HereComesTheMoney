server.address=127.0.0.1
spring.datasource.url=${LOCAL_DB_URL:jdbc:h2:tcp://127.0.0.1:9095/mem:moneybags;MODE=Oracle;DB_CLOSE_DELAY=-1;DEFAULT_NULL_ORDERING=HIGH}
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.sql.init.mode=never
moneybags.bootstrap.enabled=false
moneybags.customer-signup.enabled=true
moneybags.auth.audit-denials=false
moneybags.payment-simulation.enabled=true
moneybags.demo-funding.enabled=true
moneybags.reconciliation.suspense-gl-code=SUSPENSE
moneybags.deposit-interest.enabled=true
moneybags.internal-bank-codes=MCPB0000002
