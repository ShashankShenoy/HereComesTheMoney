spring.application.name=moneybags-backend
server.port=${SERVER_PORT:8080}

# Connect to the existing schema. This application never creates or alters tables.
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.initialization-fail-timeout=-1
spring.sql.init.mode=never

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
management.health.db.enabled=true
server.error.include-message=never
server.error.include-stacktrace=never

moneybags.auth.idle-minutes=30
moneybags.auth.absolute-hours=8
moneybags.auth.max-failed-attempts=5
moneybags.auth.lock-minutes=15
moneybags.auth.allowed-origins=${FRONTEND_ORIGINS:http://localhost:8000,http://localhost:5173,http://localhost:8081}
# Enable only once to create the first administrator in an empty IAM setup.
moneybags.bootstrap.enabled=${BOOTSTRAP_ADMIN:false}
moneybags.bootstrap.username=${BOOTSTRAP_USERNAME:admin}
moneybags.bootstrap.password=${BOOTSTRAP_PASSWORD:}
moneybags.customer-signup.enabled=${CUSTOMER_SIGNUP_ENABLED:false}
moneybags.customer-signup.branch-ref=${CUSTOMER_SIGNUP_BRANCH:MUM001}
logging.pattern.console=%d{HH:mm:ss} %-5level [%X{correlationId}] %logger{36} - %msg%n

moneybags.business-zone=Asia/Kolkata
moneybags.retention-days=2555
moneybags.worker-token-audience=moneybags-integrated
moneybags.kafka.enabled=${KAFKA_ENABLED:false}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.acks=all

springdoc.use-fqn=true

moneybags.fx.provider-url=${FX_PROVIDER_URL:}
moneybags.fx.api-token=${FX_API_TOKEN:}
moneybags.payment-simulation.enabled=${PAYMENT_SIMULATION_ENABLED:false}
moneybags.internal-bank-codes=${INTERNAL_BANK_CODES:}
moneybags.ai.provider=${AI_PROVIDER:openai}
moneybags.ai.openai-key=${OPENAI_API_KEY:}
moneybags.ai.openrouter-key=${OPENROUTER_API_KEY:}
moneybags.ai.model=${AI_MODEL:${OPENAI_MODEL:}}
moneybags.ai.fallback-model=${AI_FALLBACK_MODEL:}
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.properties.delivery.timeout.ms=10000
spring.kafka.producer.properties.request.timeout.ms=5000
