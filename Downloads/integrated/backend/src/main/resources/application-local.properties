server.address=127.0.0.1
spring.datasource.url=jdbc:h2:mem:moneybags;MODE=Oracle;DB_CLOSE_DELAY=-1;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:local-schema.sql
moneybags.bootstrap.enabled=false
moneybags.local.seed=true
moneybags.customer-signup.enabled=true
moneybags.auth.audit-denials=false
management.health.db.enabled=true
moneybags.payment-simulation.enabled=true
moneybags.internal-bank-codes=MCPB0000002
